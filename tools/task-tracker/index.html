<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>日々の記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@500;600;800&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap" rel="stylesheet">

<style>
  :root {
    --paper: #eef0ea;
    --paper-raised: #f7f8f4;
    --ink: #222a20;
    --ink-soft: #5b6455;
    --ink-faint: #8b937f;
    --line: #ccd2c2;
    --line-soft: #dbdfd2;
    --accent: #3f6652;
    --accent-soft: #dde8df;
    --accent-ink: #1f3a2c;
    --danger: #b5482f;
    --danger-bg: #f3e2dc;

    --shadow: 0 1px 2px rgba(34,42,32,0.06), 0 6px 16px rgba(34,42,32,0.05);
    --radius: 14px;
    --font-display: "Shippori Mincho", serif;
    --font-body: "Zen Kaku Gothic New", "Hiragino Sans", sans-serif;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --paper: #1b201a;
      --paper-raised: #232a20;
      --ink: #e9ece3;
      --ink-soft: #aab29e;
      --ink-faint: #737d68;
      --line: #3a4234;
      --line-soft: #2c3327;
      --accent: #7fae94;
      --accent-soft: #2a3a2e;
      --accent-ink: #cfe6d7;
      --danger: #e08a6f;
      --danger-bg: #3c2620;
      --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
    }
  }
  :root[data-theme="dark"] {
    --paper: #1b201a;
    --paper-raised: #232a20;
    --ink: #e9ece3;
    --ink-soft: #aab29e;
    --ink-faint: #737d68;
    --line: #3a4234;
    --line-soft: #2c3327;
    --accent: #7fae94;
    --accent-soft: #2a3a2e;
    --accent-ink: #cfe6d7;
    --danger: #e08a6f;
    --danger-bg: #3c2620;
    --shadow: 0 1px 2px rgba(0,0,0,0.3), 0 8px 20px rgba(0,0,0,0.35);
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: var(--font-body);
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }

  .page {
    max-width: 640px;
    margin: 0 auto;
    padding: 40px 20px 80px;
  }

  header.masthead {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 16px;
    margin-bottom: 28px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    flex-wrap: wrap;
  }

  header.masthead h1 {
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(1.5rem, 3vw, 1.9rem);
    margin: 0;
    letter-spacing: 0.02em;
  }

  header.masthead .save-note {
    font-size: 0.75rem;
    color: var(--ink-faint);
    opacity: 0;
    transition: opacity 0.3s ease;
  }
  header.masthead .save-note.visible { opacity: 1; }

  /* ---- カレンダー ---- */

  .calendar-card {
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 16px;
    margin-bottom: 24px;
  }

  .calendar-head {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
  }

  .month-label {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.05rem;
  }

  .calendar-nav { display: flex; align-items: center; gap: 4px; }

  .calendar-nav button {
    font-family: var(--font-body);
    border: 1px solid var(--line-soft);
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 8px;
    width: 30px;
    height: 30px;
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
  }
  .calendar-nav button:hover { border-color: var(--accent); color: var(--accent-ink); }

  .today-btn {
    font-family: var(--font-body);
    font-size: 0.75rem;
    font-weight: 700;
    border: 1px solid var(--line-soft);
    background: var(--paper);
    color: var(--ink-soft);
    border-radius: 8px;
    padding: 0 10px;
    height: 30px;
    cursor: pointer;
    margin-left: 6px;
  }
  .today-btn:hover { border-color: var(--accent); color: var(--accent-ink); }

  .weekday-row, .day-grid {
    display: grid;
    grid-template-columns: repeat(7, 1fr);
    gap: 4px;
  }

  .weekday-row {
    margin-bottom: 4px;
  }
  .weekday-row span {
    text-align: center;
    font-size: 0.72rem;
    color: var(--ink-faint);
    font-weight: 700;
    padding: 4px 0;
  }
  .weekday-row span.sun { color: var(--danger); }
  .weekday-row span.sat { color: #2e5266; }

  .day-cell {
    position: relative;
    aspect-ratio: 1 / 1;
    display: flex;
    align-items: center;
    justify-content: center;
    border-radius: 8px;
    border: 1px solid transparent;
    background: transparent;
    color: var(--ink);
    font-size: 0.85rem;
    cursor: pointer;
    padding: 0;
  }
  .day-cell:hover { background: var(--accent-soft); }
  .day-cell.pad { color: var(--ink-faint); opacity: 0.45; }
  .day-cell.today { border-color: var(--accent); font-weight: 700; }
  .day-cell.selected { background: var(--accent); color: var(--paper-raised); font-weight: 700; }
  .day-cell.selected:hover { background: var(--accent); }

  .day-dot {
    position: absolute;
    bottom: 5px;
    left: 50%;
    transform: translateX(-50%);
    width: 4px;
    height: 4px;
    border-radius: 50%;
    background: var(--accent);
  }
  .day-cell.selected .day-dot { background: var(--paper-raised); }

  /* ---- 記録セクション ---- */

  .record-card {
    background: var(--paper-raised);
    border: 1px solid var(--line-soft);
    border-radius: var(--radius);
    box-shadow: var(--shadow);
    padding: 18px;
  }

  .record-head {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 10px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }

  .record-head h2 {
    font-family: var(--font-display);
    font-weight: 700;
    font-size: 1.1rem;
    margin: 0;
  }

  .record-count {
    font-size: 0.78rem;
    color: var(--ink-faint);
  }

  .add-form {
    display: flex;
    gap: 8px;
    margin-bottom: 16px;
  }

  .add-form input[type="text"] {
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 11px 14px;
    font-size: 0.95rem;
    transition: border-color 0.15s ease, box-shadow 0.15s ease;
  }
  .add-form input[type="text"]:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .add-form button {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.88rem;
    border: none;
    border-radius: 10px;
    padding: 0 18px;
    cursor: pointer;
    background: var(--ink);
    color: var(--paper);
    transition: opacity 0.15s ease, transform 0.1s ease;
    flex-shrink: 0;
  }
  .add-form button:hover { opacity: 0.85; }
  .add-form button:active { transform: scale(0.97); }

  @media (max-width: 420px) {
    .add-form { flex-wrap: wrap; }
    .add-form input[type="text"] { flex-basis: 100%; }
    .add-form button { flex: 1; }
  }

  .record-list {
    list-style: none;
    margin: 0;
    padding: 0;
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .record-item {
    display: flex;
    align-items: flex-start;
    gap: 10px;
    background: var(--paper);
    border: 1px solid var(--line-soft);
    border-radius: 10px;
    padding: 10px 12px;
  }

  .record-time {
    flex-shrink: 0;
    font-variant-numeric: tabular-nums;
    font-size: 0.76rem;
    color: var(--ink-faint);
    margin-top: 2px;
  }

  .record-text {
    flex: 1;
    font-size: 0.92rem;
    word-break: break-word;
    white-space: pre-wrap;
  }

  .record-actions {
    flex-shrink: 0;
    display: flex;
    gap: 2px;
  }

  .record-edit, .record-del {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 1.05rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .record-edit:hover { color: var(--accent-ink); background: var(--accent-soft); }
  .record-del:hover { color: var(--danger); background: var(--danger-bg); }

  .record-edit-input {
    flex: 1;
    min-width: 0;
    font-family: var(--font-body);
    color: var(--ink);
    background: var(--paper-raised);
    border: 1px solid var(--accent);
    border-radius: 8px;
    padding: 6px 9px;
    font-size: 0.92rem;
  }
  .record-edit-input:focus {
    outline: none;
    box-shadow: 0 0 0 3px var(--accent-soft);
  }

  .record-save {
    flex-shrink: 0;
    border: none;
    background: var(--accent);
    color: var(--paper-raised);
    cursor: pointer;
    font-size: 0.95rem;
    line-height: 1;
    padding: 2px 8px;
    border-radius: 4px;
  }
  .record-save:hover { opacity: 0.85; }

  .record-cancel {
    flex-shrink: 0;
    border: none;
    background: transparent;
    color: var(--ink-faint);
    cursor: pointer;
    font-size: 1.05rem;
    line-height: 1;
    padding: 2px 6px;
    border-radius: 4px;
  }
  .record-cancel:hover { color: var(--danger); background: var(--danger-bg); }

  .empty-hint {
    font-size: 0.85rem;
    color: var(--ink-faint);
    font-style: italic;
    padding: 20px 4px;
    text-align: center;
  }

  button:focus-visible, input:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  /* ---- 取り消しトースト ---- */

  .undo-toast {
    position: fixed;
    left: 50%;
    bottom: 24px;
    transform: translateX(-50%) translateY(120%);
    background: var(--ink);
    color: var(--paper);
    border-radius: 10px;
    padding: 10px 12px 10px 16px;
    display: flex;
    align-items: center;
    gap: 12px;
    font-size: 0.85rem;
    box-shadow: 0 8px 24px rgba(0,0,0,0.25);
    transition: transform 0.25s ease;
    z-index: 10;
    max-width: calc(100vw - 40px);
  }
  .undo-toast.visible { transform: translateX(-50%) translateY(0); }

  .undo-toast span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  .undo-toast button {
    font-family: var(--font-body);
    font-weight: 700;
    font-size: 0.82rem;
    border: none;
    background: var(--accent-soft);
    color: var(--accent-ink);
    border-radius: 7px;
    padding: 6px 12px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .undo-toast button:hover { opacity: 0.85; }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; }
  }
</style>
</head>
<body>

<div class="page">
  <header class="masthead">
    <h1>日々の記録</h1>
    <span class="save-note" id="saveNote">保存しました</span>
  </header>

  <div class="calendar-card">
    <div class="calendar-head">
      <span class="month-label" id="monthLabel"></span>
      <div class="calendar-nav">
        <button type="button" id="prevMonthBtn" aria-label="前の月">‹</button>
        <button type="button" id="nextMonthBtn" aria-label="次の月">›</button>
        <button type="button" class="today-btn" id="todayBtn">今日</button>
      </div>
    </div>
    <div class="weekday-row">
      <span class="sun">日</span><span>月</span><span>火</span><span>水</span><span>木</span><span>金</span><span class="sat">土</span>
    </div>
    <div class="day-grid" id="dayGrid"></div>
  </div>

  <div class="record-card">
    <div class="record-head">
      <h2 id="selectedDateLabel"></h2>
      <span class="record-count" id="recordCount"></span>
    </div>
    <form class="add-form" id="addForm">
      <input type="text" id="recordText" placeholder="今日やったことを入力" maxlength="200" autocomplete="off" required>
      <button type="submit">記録する</button>
    </form>
    <ul class="record-list" id="recordList"></ul>
  </div>
</div>

<div class="undo-toast" id="undoToast">
  <span id="undoText"></span>
  <button type="button" id="undoBtn">元に戻す</button>
</div>

<script>
(function () {
  const STORAGE_KEY = "daily-log-v1";
  const WEEKDAY_JP = ["日", "月", "火", "水", "木", "金", "土"];

  function pad2(n) { return String(n).padStart(2, "0"); }

  function dateKey(y, m, d) {
    return y + "-" + pad2(m + 1) + "-" + pad2(d);
  }

  function todayKey() {
    const d = new Date();
    return dateKey(d.getFullYear(), d.getMonth(), d.getDate());
  }

  function genId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
  }

  function defaultState() {
    return { records: {} };
  }

  function sanitizeEntry(e) {
    if (!e || typeof e.id !== "string" || typeof e.text !== "string") return null;
    return { id: e.id, text: e.text, ts: typeof e.ts === "number" ? e.ts : Date.now() };
  }

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (!raw) return defaultState();
      const parsed = JSON.parse(raw);
      const state = defaultState();
      if (parsed.records && typeof parsed.records === "object") {
        Object.keys(parsed.records).forEach((key) => {
          if (!/^\d{4}-\d{2}-\d{2}$/.test(key)) return;
          if (!Array.isArray(parsed.records[key])) return;
          const entries = parsed.records[key].map(sanitizeEntry).filter(Boolean);
          if (entries.length) state.records[key] = entries;
        });
      }
      return state;
    } catch (e) {
      return defaultState();
    }
  }

  let state = loadState();
  let saveTimer = null;

  function persist() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    const note = document.getElementById("saveNote");
    note.classList.add("visible");
    clearTimeout(saveTimer);
    saveTimer = setTimeout(() => note.classList.remove("visible"), 1200);
  }

  function escapeHtml(str) {
    const div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function formatTime(ts) {
    const d = new Date(ts);
    return pad2(d.getHours()) + ":" + pad2(d.getMinutes());
  }

  const today = new Date();
  let viewYear = today.getFullYear();
  let viewMonth = today.getMonth(); // 0-11
  let selectedKey = todayKey();

  // ---- 取り消しトースト ----
  let undoTimer = null;
  let pendingUndo = null; // { key, entry }

  function showUndoToast(key, entry) {
    pendingUndo = { key: key, entry: entry };
    const toast = document.getElementById("undoToast");
    document.getElementById("undoText").textContent = "「" + entry.text + "」を削除しました";
    toast.classList.add("visible");
    clearTimeout(undoTimer);
    undoTimer = setTimeout(hideUndoToast, 6000);
  }

  function hideUndoToast() {
    pendingUndo = null;
    document.getElementById("undoToast").classList.remove("visible");
    clearTimeout(undoTimer);
  }

  document.getElementById("undoBtn").addEventListener("click", () => {
    if (!pendingUndo) return;
    const { key, entry } = pendingUndo;
    if (!state.records[key]) state.records[key] = [];
    state.records[key].push(entry);
    state.records[key].sort((a, b) => a.ts - b.ts);
    persist();
    hideUndoToast();
    renderCalendar();
    renderRecords();
  });

  // ---- カレンダー ----

  function renderCalendar() {
    document.getElementById("monthLabel").textContent = viewYear + "年" + (viewMonth + 1) + "月";
    const grid = document.getElementById("dayGrid");
    grid.innerHTML = "";

    const firstWeekday = new Date(viewYear, viewMonth, 1).getDay();
    const daysInMonth = new Date(viewYear, viewMonth + 1, 0).getDate();
    const totalCells = Math.ceil((firstWeekday + daysInMonth) / 7) * 7;
    const tKey = todayKey();

    for (let i = 0; i < totalCells; i++) {
      const dayNum = i - firstWeekday + 1;
      const cell = document.createElement("button");
      cell.type = "button";
      cell.className = "day-cell";

      let cellYear = viewYear, cellMonth = viewMonth, cellDay = dayNum;
      if (dayNum < 1) {
        cellMonth = viewMonth - 1;
        const d = new Date(viewYear, cellMonth + 1, 0).getDate();
        cellDay = d + dayNum;
        if (cellMonth < 0) { cellMonth = 11; cellYear -= 1; }
        cell.classList.add("pad");
      } else if (dayNum > daysInMonth) {
        cellMonth = viewMonth + 1;
        cellDay = dayNum - daysInMonth;
        if (cellMonth > 11) { cellMonth = 0; cellYear += 1; }
        cell.classList.add("pad");
      }
      const key = dateKey(cellYear, cellMonth, cellDay);
      if (key === tKey) cell.classList.add("today");
      if (key === selectedKey) cell.classList.add("selected");

      cell.innerHTML = String(cellDay) + (state.records[key] && state.records[key].length ? '<span class="day-dot"></span>' : "");
      cell.addEventListener("click", () => {
        selectedKey = key;
        editingId = null;
        if (cellMonth !== viewMonth || cellYear !== viewYear) {
          viewYear = cellYear;
          viewMonth = cellMonth;
        }
        renderCalendar();
        renderRecords();
      });
      grid.appendChild(cell);
    }
  }

  function shiftMonth(delta) {
    viewMonth += delta;
    if (viewMonth < 0) { viewMonth = 11; viewYear -= 1; }
    if (viewMonth > 11) { viewMonth = 0; viewYear += 1; }
    renderCalendar();
  }

  document.getElementById("prevMonthBtn").addEventListener("click", () => shiftMonth(-1));
  document.getElementById("nextMonthBtn").addEventListener("click", () => shiftMonth(1));
  document.getElementById("todayBtn").addEventListener("click", () => {
    const d = new Date();
    viewYear = d.getFullYear();
    viewMonth = d.getMonth();
    selectedKey = todayKey();
    editingId = null;
    renderCalendar();
    renderRecords();
  });

  // ---- 記録リスト ----

  function selectedDateLabelText() {
    const [y, m, d] = selectedKey.split("-").map(Number);
    const wd = WEEKDAY_JP[new Date(y, m - 1, d).getDay()];
    const suffix = selectedKey === todayKey() ? "（今日）" : "";
    return m + "月" + d + "日（" + wd + "）" + suffix;
  }

  let editingId = null;

  function commitEdit(li, entry) {
    const input = li.querySelector(".record-edit-input");
    const text = input.value.trim();
    if (text) {
      entry.text = text;
      persist();
    }
    editingId = null;
    renderRecords();
  }

  function renderRecords() {
    document.getElementById("selectedDateLabel").textContent = selectedDateLabelText();
    const list = document.getElementById("recordList");
    list.innerHTML = "";
    const entries = (state.records[selectedKey] || []).slice().sort((a, b) => a.ts - b.ts);
    document.getElementById("recordCount").textContent = entries.length ? entries.length + "件" : "";

    if (entries.length === 0) {
      const hint = document.createElement("li");
      hint.className = "empty-hint";
      hint.textContent = "この日の記録はまだありません";
      list.appendChild(hint);
      return;
    }

    entries.forEach((entry) => {
      const li = document.createElement("li");
      li.className = "record-item";

      if (entry.id === editingId) {
        li.innerHTML =
          '<span class="record-time">' + formatTime(entry.ts) + "</span>" +
          '<input type="text" class="record-edit-input" maxlength="200" value="' + escapeHtml(entry.text) + '">' +
          '<span class="record-actions">' +
            '<button type="button" class="record-save" aria-label="保存">✓</button>' +
            '<button type="button" class="record-cancel" aria-label="キャンセル">×</button>' +
          "</span>";
        const editInput = li.querySelector(".record-edit-input");
        li.querySelector(".record-save").addEventListener("click", () => commitEdit(li, entry));
        li.querySelector(".record-cancel").addEventListener("click", () => {
          editingId = null;
          renderRecords();
        });
        editInput.addEventListener("keydown", (e) => {
          if (e.key === "Enter") { e.preventDefault(); commitEdit(li, entry); }
          if (e.key === "Escape") { e.preventDefault(); editingId = null; renderRecords(); }
        });
        list.appendChild(li);
        editInput.focus();
        editInput.select();
        return;
      }

      li.innerHTML =
        '<span class="record-time">' + formatTime(entry.ts) + "</span>" +
        '<span class="record-text">' + escapeHtml(entry.text) + "</span>" +
        '<span class="record-actions">' +
          '<button type="button" class="record-edit" aria-label="編集">✎</button>' +
          '<button type="button" class="record-del" aria-label="削除">×</button>' +
        "</span>";
      li.querySelector(".record-edit").addEventListener("click", () => {
        editingId = entry.id;
        renderRecords();
      });
      li.querySelector(".record-del").addEventListener("click", () => {
        state.records[selectedKey] = (state.records[selectedKey] || []).filter((e) => e.id !== entry.id);
        if (state.records[selectedKey].length === 0) delete state.records[selectedKey];
        persist();
        showUndoToast(selectedKey, entry);
        renderCalendar();
        renderRecords();
      });
      list.appendChild(li);
    });
  }

  // ---- 追加フォーム ----

  document.getElementById("addForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const input = document.getElementById("recordText");
    const text = input.value.trim();
    if (!text) return;
    if (!state.records[selectedKey]) state.records[selectedKey] = [];
    state.records[selectedKey].push({ id: genId(), text: text, ts: Date.now() });
    input.value = "";
    persist();
    renderCalendar();
    renderRecords();
    input.focus();
  });

  renderCalendar();
  renderRecords();
})();
</script>
</body>
</html>
